name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        # macos-15 ships with Xcode 16.x, which understands the
        # objectVersion = 77 project format generated by XcodeGen.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show environment
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project (CI variant with SDK stub)
        run: xcodegen generate --spec project.ci.yml

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project SampleTapOnPhone.xcodeproj \
            -scheme SampleTapOnPhone \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build
